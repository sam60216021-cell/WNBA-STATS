services:
  - type: web
    name: wnba-stats
    env: python
    # NOTE: this repo's root *is* the service root (app.py lives here), so no
    # rootDir is needed. If Blueprint sync was previously failing, this is why.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    region: oregon
    plan: free
    # NOTE: persistent disks (to survive cold-start re-scrapes) require a paid
    # plan. When upgrading, re-add:
    #   disk:
    #     name: wnba-data
    #     mountPath: /var/data
    #     sizeGB: 1
    # app.py already prefers /var/data/wnba_logs.db when present and falls
    # back to /tmp otherwise, so no code change is needed either way.
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      # WNBA_SEASON deliberately not set — app.py auto-derives the season
      # (May rollover). Set it here only to force a specific season.
      - key: WNBA_BULK_FALLBACK_MAX
        value: "0"
      # balldontlie WNBA API key (https://app.balldontlie.io — free tier: 1
      # sport, 5 req/min). Required for the daily game-log sync that replaced
      # Basketball-Reference scraping, and the schedule/standings fallback.
      # Create a free account, pick WNBA as your sport, paste the key here
      # (or set it in the dashboard instead of the blueprint).
      - key: BDL_API_KEY
        sync: false
      # Shared secret required by the admin endpoints (/wnba/sync, /wnba/scrape,
      # /wnba/seed_import). Generate one with: python3 -c "import secrets; print(secrets.token_urlsafe(24))"
      # Then call e.g.: curl -H "X-API-Key: <key>" https://<host>/wnba/sync
      # Falls back to WNBA_API_KEY if unset; if neither is set the admin
      # endpoints return 503 (the background sync still runs normally).
      - key: WNBA_SYNC_KEY
        sync: false
    healthCheckPath: /health
