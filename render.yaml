services:
  - type: web
    name: wnba-stats
    env: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload
    region: oregon
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: WNBA_SEASON
        value: "2026"
      - key: WNBA_BULK_FALLBACK_MAX
        value: "0"
    healthCheckPath: /health
